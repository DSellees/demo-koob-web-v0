<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOOB</title>
    <meta name="description" content="Consultoría multidisciplinar de dirección y transformación para empresas que necesitan recuperar crecimiento, rentabilidad y dirección estratégica." />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <script>
      const pagesRedirect = sessionStorage.getItem('koob-pages-redirect');
      if (pagesRedirect) {
        sessionStorage.removeItem('koob-pages-redirect');
        const projectBase = '/demo-koob-web-v0';
        const route = pagesRedirect.startsWith(projectBase)
          ? pagesRedirect.slice(projectBase.length) || '/'
          : pagesRedirect;
        window.history.replaceState(null, '', `${projectBase}${route}`);
      }
    </script>

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://koobadvisory.com/" />
    <meta property="og:title" content="KOOB Advisory — Consultoría estratégica" />
    <meta property="og:description" content="Acompañamos a empresas en momentos de transformación, crecimiento y cambio." />
    <meta property="og:image" content="https://koobadvisory.com/og-image.png" />
    <meta property="og:locale" content="es_ES" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KOOB Advisory" />
    <meta name="twitter:description" content="Consultoría estratégica para empresas en momentos clave." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts: Preload Inter variable from local -->
    <link rel="preload" as="font" href="/fonts/inter-variable.woff2" type="font/woff2" crossorigin />

    <!-- Canonical (set per route by react-helmet) -->
    <link rel="canonical" href="https://koobadvisory.com/" />

    <!-- JSON-LD: Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "KOOB Advisory",
      "url": "https://koobadvisory.com",
      "logo": "https://koobadvisory.com/logo-koob-black.svg",
      "description": "Consultoría multidisciplinar de dirección y transformación",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+34-609-483-114",
        "contactType": "Customer Service"
      },
      "sameAs": [
        "https://www.linkedin.com/company/koob-advisory",
        "https://www.instagram.com/koob.advisory",
        "https://www.youtube.com/@KOOB_ADVISORY"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
